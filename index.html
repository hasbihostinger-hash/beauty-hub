<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beauty Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f0f0f;
    margin: 0;
    padding: 0;
    color: #fff;
}

.content-wrapper {
    width: calc(100% - 30px);
    max-width: 520px;
    margin: 15px auto;
    background: #151515;
    border-radius: 14px;
    box-shadow: 0 0 25px rgba(229, 9, 20, 0.15);
    padding: 20px;
    text-align: center;
}

/* THUMBNAIL */
.thumbnail {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 16px;
    filter: blur(2px) brightness(0.9);
}

/* PLAY BUTTON */
.play-button {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.play-icon {
    width: 55px;
    height: 55px;
    fill: #fff;
}

/* WATCH BUTTON */
.watch-btn {
    display: inline-block;
    margin-top: 15px;
    width: 90%;
    max-width: 400px;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    background: #e50914;
    color: #fff !important;
    text-decoration: none;
    border-radius: 14px;
    transition: 0.3s ease;
    animation: pulse 2.4s infinite ease-in-out;
}

.watch-btn:active {
    transform: scale(0.97);
}

/* PULSE */
@keyframes pulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.04);
    }

    100% {
        transform: scale(1);
    }
}

/* SUBTEXT */
.subtext {
    margin-top: 12px;
    font-size: 14px;
    color: #aaa;
}

/* MOBILE */
@media (max-width: 480px) {
    .content-wrapper {
        width: calc(100% - 20px);
        padding: 15px;
    }

    .play-button {
        width: 75px;
        height: 75px;
    }

    .play-icon {
        width: 45px;
        height: 45px;
    }

    .watch-btn {
        font-size: 16px;
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="content-wrapper">

    <a class="thumbnail" href="https://t.co/2cwFt13MYh">
        <img
            src="https://cdn.aceimg.com/tXT9hqEti.png"
            alt="Video Preview"
        >

        <div class="play-button">
            <svg viewBox="0 0 24 24" class="play-icon">
                <polygon points="6,4 20,12 6,20"></polygon>
            </svg>
        </div>
    </a>

    <a class="watch-btn" href="https://t.co/2cwFt13MYh">
        ▶️ Watch Now
    </a>

    <div class="subtext">
        Tap the button above to continue.
    </div>

</div>
